[Unit]
Requires=nftables.service
After=nftables.service systemd-resolved.service

[Service]
Restart=on-failure
RestartSec=5s
# '+' runs only lifecycle management as root; Xray itself keeps User=xray.
ExecStartPre=+/etc/xray/scripts/lifecycle/start.sh
ExecStartPre=/bin/sh -c /etc/xray/scripts/interface-config.sh
ExecStartPost=/bin/sh -c /etc/xray/scripts/route-setup.sh
# Also runs after failed starts/crashes, once Xray has released DNS and its TUN.
ExecStopPost=+/etc/xray/scripts/lifecycle/stop.sh
