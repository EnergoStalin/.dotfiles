[Resolve]
# Independent upstreams avoid looping through /etc/resolv.conf's localhost DNS.
# networkd may additionally supply per-link DNS; no network manager is restarted.
# Quad9 first: Cloudflare intermittently times out on this uplink.
DNS=9.9.9.9 1.1.1.1
# Prefer these for public names even if NM left a localhost per-link DNS entry.
# More-specific networkd search/routing domains can still use their own servers.
Domains=~.
DNSStubListener=yes
DNSStubListenerExtra=127.0.0.1
