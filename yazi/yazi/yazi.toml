# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [0, 4, 4]
sort_by = "alphabetical"
linemode = "size"
mouse_events = []

[plugin]
prepend_fetchers = [
	{ id = "mime", url = "*", if = "!mime", run = "mime-ext.local", prio = "high", group = "mime" },
]
prepend_previewers = [
	{ id = "video", mime = "video/*", run = "noop", prio = "high", group = "mime" },
]
prepend_preloaders = [
	{ id = "video", mime = "video/*", run = "noop", prio = "high", group = "mime" },
]

[preview]
max_width = 4000
max_height = 4000
image_delay = 100
image_quality = 50
image_filter = 'lanczos3'

[opener]
play = [
	{ run = 'mpv --force-window --use-filedir-conf %s >& /dev/null & disown', orphan = true, for = "unix" },
	{ run = 'mpv --force-window "%%1"', orphan = true, for = "windows" },
	{ run = 'ffprobe -hide_banner %s1; echo "Press enter to exit"; read _', block = true, desc = "Show media info", for = "unix" },
]
asar = [
	{ run = 'asar extract "$1"', desc = "Extract here", for = "unix" },
	{ run = 'v=%s1 asar extract %s1 "${v%.*}" ', desc = "Extract subfolder", for = "unix" },
]
rar = [
	{ run = 'unar %s1', desc = "Extract here", for = "unix" },
	{ run = 'v=%s1 unar -output-directory "${v%.*}" %s1', desc = "Extract subfolder", for = "unix" },
]
tar = [
	{ run = 'tar -xf %s1', desc = "Extract here", for = "unix" },
	{ run = 'v=%s1 mkdir "${v%.*}" && tar -C "${v%.*}" -xf %s1', desc = "Extract subfolder", for = "unix" },
]
extract = [
	{ run = '7z -bsp1 x %s1', desc = "Extract here", for = "unix" },
	{ run = 'v=%s1 basename "${v%.*}" | 7z -bsp1 x %s1', desc = "Extract here (pswd)", for = "unix" },
	{ run = '7z -bsp1 -o"*" x %s1', desc = "Extract subfolder", for = "unix" },
]
zip-folder = [
	{ run = 'cd %s1 && 7z a %s1.7z .', desc = "7z", for = "unix" },
]
extract-iso = [
	{ run = '7z x -tiso -o"*" %s1', desc = "Extract iso subfolder", for = "unix" },
]
unrpa = [
	{ run = 'v=%s1 unrpa %s1 --mkdir --path "${v%.*}"', desc = "unrpa to subfolder", for = "unix" },
]
denoise = [
	{ run = 'v=%s1 ffmpeg -i %s1 -af anlmdn -y "${v%.*}.denoised.${v##*.}"', desc = "apply denoise filter", for = "unix" },
]
rpgmv-decrypt = [
	{ run = '[[ -d "$(pwd)/www" ]] && rpgmv-decrypter "$(pwd)/www" || rpgmv-decrypter "$(pwd)"', desc = "Decrypt rpgmaker folder", for = "unix" },
]
unity-decrypt = [
	{ run = 'AssetStudioModCLI "$(pwd)" -m Export -t sprite,video -o "./$(basename "$(find . -name "*_Data")")_Exported"', desc = "Extract unity assets", for = "unix" },
]
feh = [{ run = 'feh %s', desc = "Show images with feh", for = "unix" }]
images = [
	{ run = 'imv -r %s1', desc = "Show images in folders recursively", for = "unix" },
	{ run = '''
    find %s1 \( -name "*.png" -o -name ".jp*g" \) -print0 | while IFS= read -r -d '' img; do
      dimensions=$(identify -format "%w %h" "$img" 2>/dev/null)
      if [[ $? -eq 0 ]]; then
        read width height <<< "$dimensions"

        if [[ $width -ge 600 && $height -ge 400 ]]; then
            printf "%s\0" "$img"
        fi
      fi
    done | sort -z -n | xargs -0 imv"
  ''', desc = "Show images bigger than 600x400 in folders recursively", for = "unix" },
	{ run = '''cd %s1; find . -maxdepth 1 -name '*.jpg' -print0 | xargs -0 -P 16 -I{} ffmpeg -y -i "{}" -vf "scale='if(gt(a,1),1920,-1)':'if(gt(a,1),-1,1920)'" "{}.png"; rm *.jpg; for f in *.jpg.png; do mv -- "$f" "${f%.jpg.png}.png"; done''', desc = 'Scale jpegs to 1080p', for = 'unix' },
]
adb-install = [
	{ run = 'adb install "$1"', desc = "Install app to phone through adb", for = "unix" },
]
exe = [
	{ run = 'ghidra %s1 >& /dev/null & disown', desc = "Open in ghidra", for = "unix" },
	{ run = 'wine %s1 >& /dev/null & disown', desc = "Run under wine", for = "unix" },
]
libreoffice = [
	{ run = 'libreoffice %s1 >& /dev/null & disown', desc = "Open in libreoffice", for = "unix" },
]
dnspy = [
	{ run = 'dnspy %s1', desc = "DNSPY", for = "unix" },
]
osu = [
	{ run = 'osu %s', desc = "osu!lazer", for = "unix" },
]
evbunpack = [
	{ run = 'evbunpack %s1 unpack', desc = "Unpack enigma executable", for = "unix" },
]
gameripper = [
	{ run = 'gameripper %s', desc = "Gameripper", for = "unix" },
]
gimp = [
	{ run = 'gimp %s', desc = "GIMP", for = "unix" },
]
wallpaper = [
	{ run = 'setwp %s1', desc = 'Set primary monitor wallpaper (hyprland)', for = 'unix' }
]
browser = [
	{ run = 'chromium %s1 >& /dev/null & disown', desc = 'Open in browser', for = 'unix' }
]

[open]
prepend_rules = [
	# Game shortcuts
	{ url = "*.dll", use = ["dnspy"] },
	{ url = "*Game.exe", use = ["rpgmv-decrypt", "evbunpack"] },
	{ url = "*Game.rpgproject", use = ["rpgmv-decrypt"] },
	{ url = "*nw", use = ["rpgmv-decrypt"] },
	{ url = "*_Data/", use = ["unity-decrypt"] },
	{ url = "*.rpa", use = ["unrpa"] },
	{ url = "*.apk", use = ["extract", "*.apk"] },

	{ url = "*.psd", use = ["gimp"] },
	{ url = "*.xml", use = ["edit"] },
	{ url = "*.{html,pdf}", use = ["browser", "edit"] },
	{ url = "*.bat", use = ["edit"] },

	{ url = "*.{mkv,mp4}", use = ["play", "denoise"] },
	{ url = "*.gif", use = ["play"] },

	{ url = "*.os{z,k}", use = ["osu", "extract"] },

	{ url = "*.tar*", use = ["tar"] },
	{ url = "*.rar", use = ["rar"] },

	{ url = "*.asar", use = ["asar"] },

	{ url = "*.exe", use = ["exe"] },

	{ url = "*.iso", use = ["extract-iso"] },

	{ url = "*.{docx,doc}", use = ["libreoffice"] },

	{ mime = "image/*", use = ["feh", "gimp", "wallpaper", "gameripper", ] },
]
append_rules = [{ url = "*/", use = ["images", "zip-folder"] }]